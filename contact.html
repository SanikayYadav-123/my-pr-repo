<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #333;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5bd4;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>

        <p>We would love to hear from you!</p>

        <form onsubmit="sendMessage(event)">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Write your message here..."
                required
            ></textarea>

            <button type="submit">Send Message</button>

        </form>

        <a href="index.html" class="back-link">
            Back to Home
        </a>

    </div>

    <script>
        function sendMessage(event) {
            event.preventDefault();

            alert("Thank you! Your message has been submitted successfully.");

            event.target.reset();
        }
    </script>

</body>
</html>
